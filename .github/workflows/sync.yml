name: Sync Netcup Vouchers

on:
  repository_dispatch:
    types: [sync_vouchers] # 网站有更新时通过 Webhook 自动触发
  schedule:
    - cron: '0 */6 * * *'  # 保底定时：每 6 小时自动同步一次
  workflow_dispatch:       # 支持在网页上手动点击运行

concurrency:
  group: sync-vouchers
  cancel-in-progress: true

permissions:
  contents: write # 赋予自动提交并推送 README 的写权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        env:
          WEBSITE_API_URL: ${{ vars.WEBSITE_API_URL || 'https://netcup.free/api/coupons' }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL || 'https://netcup.free' }}
          AFF_REF_CODE: ${{ vars.AFF_REF_CODE || '257842' }}
        run: python sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_ZH.md README_DE.md
          if git diff --staged --quiet; then
            echo "No changes detected in coupon codes. Skipping commit."
          else
            git commit -m "Auto-update voucher codes [skip ci]"
            git push
          fi
